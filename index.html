<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d18">
<title>KINGDOMS: Rise of Empires</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="top1">
      <div class="brand">KINGDOMS</div>
      <div id="clock"></div>
      <div class="menu">
        <button data-menu="save">حفظ</button>
        <button data-menu="load">تحميل</button>
        <button data-menu="reset" class="danger">إعادة بدء</button>
        <button data-menu="help">؟</button>
      </div>
    </div>
    <div id="res" class="res"></div>
  </header>

  <main id="stage">
    <canvas id="map"></canvas>
    <div id="toolbar">
      <button id="btnZoomIn">＋</button>
      <button id="btnZoomOut">−</button>
      <button id="btnCenter">⌖</button>
      <button id="btnSpeed">1×</button>
      <button id="btnPause">⏸</button>
      <button id="btnMulti" class="ghost">تحديد متعدد: إيقاف</button>
    </div>
  </main>

  <nav id="tabs">
    <button data-tab="map" class="on">الميدان</button>
    <button data-tab="build">البناء</button>
    <button data-tab="army">الجيش</button>
    <button data-tab="research">الأبحاث</button>
    <button data-tab="diplo">الدبلوماسية</button>
    <button data-tab="missions">المهام</button>
    <button data-tab="log">السجل</button>
  </nav>

  <section id="panel"></section>
</div>

<div id="modal" class="hidden">
  <div class="box">
    <div id="modalText"></div>
    <div class="row">
      <button id="modalOk">نعم</button>
      <button id="modalCancel" class="ghost">إلغاء</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="game.js"></script>
</body>
</html>
